[book]
title = "Mercury Trading Engine"
authors = ["Amjad Hossain"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "ayu"
fold.enable = true
fold.level = 1
git-repository-url = "https://github.com/amjadjibon/mercury"
edit-url-template = "https://github.com/amjadjibon/mercury/edit/main/docs/src/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
