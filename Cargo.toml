[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/market",
    "crates/strategy",
    "crates/risk",
    "crates/execution",
    "crates/gateway",
    "crates/replay",
    "crates/metrics",
    "crates/cli",
    "crates/tui",
    "crates/benches", "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Parallel computation
rayon = "1.10"

# Lock-free concurrency
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# CLI
clap = { version = "4.5", features = ["derive"] }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Data storage
parquet = "54"
arrow = "54"

# Metrics & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
hdrhistogram = "7.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.37", features = ["serde"] }
rust_decimal_macros = "1.37"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"

# CPU affinity
core_affinity = "0.8"

# Low-level socket options (Linux only)
libc = "0.2"

toml = "0.8"

# ML inference (pure Rust ONNX runtime, no system library required)
tract-onnx = "0.21"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
stats_alloc = "0.1"
